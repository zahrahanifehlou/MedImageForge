# MedImageForge default configuration.
# All paths are relative to the project root (the folder containing this repo).
# Steps later in the roadmap read everything from here instead of hardcoding paths.

project:
  name: medimageforge
  version: 0.1.0

paths:
  data_dir: data                          # the dataset root (gitignored)
  raw_dir: data/Patients_CT               # raw zone: patient folders, never modified
  labels_csv: data/hemorrhage_diagnosis.csv
  demographics_csv: data/patient_demographics.csv
  checksums_file: data/SHA256SUMS.txt     # official integrity checksums
  artifacts_dir: artifacts                # everything we generate (manifests, curated data, reports)
  manifest_db: artifacts/manifest.db      # SQLite manifest — the platform's source of truth
  curated_dir: artifacts/curated          # curated zone: validated, normalized copies (never raw)
  deid_dir: artifacts/deid                # pseudonymized exports — may leave the controlled zone
  datasets_dir: datasets                  # immutable dataset releases (v1.0, v1.1, ...)
  runs_dir: artifacts/runs                # one folder per training run: record, weights, predictions
  eval_dir: artifacts/eval                # per-run evaluation reports and error-analysis images
  salt_file: .secrets/pseudonym_salt      # re-identification key: gitignored, NEVER committed

dataset:
  patient_id_width: 3                     # folder names are zero-padded to 3 digits: 049, 050, ...
  windows: [brain, bone]                  # the two CT window folders inside each patient dir
  mask_suffix: _HGE_Seg                   # e.g. 14_HGE_Seg.jpg is the mask for 14.jpg
  expected_size: [650, 650]               # every slice must be exactly this (validation rule)
  mask_threshold: 128                     # JPEG masks aren't binary; threshold to recover 0/255

qc:
  # Leakage detection is two-stage. Stage 1 is a cheap perceptual-hash filter;
  # stage 2 confirms candidates on real pixels. min_correlation was CALIBRATED,
  # not guessed: the closest cross-patient pair in this dataset scores 0.950,
  # while same-patient adjacent slices average 0.896 — the two overlap, so the
  # confirmation threshold must sit above the whole cross-patient range.
  leakage_max_hamming: 2                  # stage 1: dhash candidate distance
  leakage_min_correlation: 0.99           # stage 2: confirm a true duplicate

release:
  version: v1.0
  seed: 20260915                          # fixed seed => the split is reproducible
  # Ratios are applied PER STRATUM, not to the patient list as a whole.
  ratios:
    train: 0.70
    validation: 0.15
    test: 0.15
  # We stratify on patient-level hemorrhage status only (36 positive / 46
  # negative). Adding fracture as a second factor creates a stratum with a
  # single patient, which cannot be divided across three splits — see
  # docs/steps/step-09-dataset-versioning.md. Fracture/age/gender balance is
  # therefore REPORTED in the dataset card rather than enforced.
  stratify_by: hemorrhage

training:
  window: brain                           # hemorrhage is visible in the brain window (Step 3)
  image_size: 128                         # 650 -> 128 keeps CPU training minutes, not hours
  batch_size: 32
  epochs: 15
  learning_rate: 0.001
  weight_decay: 0.0001
  dropout: 0.3
  seed: 20260915

active_learning:
  seed_fraction: 0.4                      # fraction of train patients labelled at round 0
  budget: 12                              # patients a reviewer can annotate this round
  seeds: 3                                # repeat the whole experiment N times
  uncertainty_rule: mean                  # aggregate slice entropy per patient: mean | max
  next_version: v1.1

evaluation:
  top_n: 8                                # how many worst mistakes to list and render
  # A missed hemorrhage is far costlier than a false alarm, so we also report the
  # operating point that reaches this recall — whatever precision it costs.
  high_sensitivity_recall: 0.90
  bootstrap_resamples: 2000

logging:
  level: INFO                             # DEBUG while developing, INFO+ in "production"
