[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medimageforge"
version = "0.1.0"
description = "Learning project: end-to-end medical imaging data platform for continuous AI model improvement"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
