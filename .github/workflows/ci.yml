# Step 16: CI — every push runs the suite on a clean checkout.
#
# The dataset and artifacts are gitignored, so CI tests the contract a
# fresh clone sees: all synthetic tests run, `needs_data` tests skip
# (see tests/conftest.py). What CI proves: the package installs cleanly,
# imports resolve, and the platform logic is correct without the data.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # torch's CPU-only wheel lives on PyTorch's own index. EXTRA index,
      # not --index-url: the latter replaces PyPI and makes modern pip
      # fail on normalized-name mismatches (see Dockerfile comment).
      - name: Install dependencies and the package
        run: |
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Test suite
        run: pytest -q

      - name: CLI smoke test
        run: python -m medimageforge info
